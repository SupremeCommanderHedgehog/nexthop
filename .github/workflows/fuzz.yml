name: Fuzz

# Fuzz harnesses run on:
#   - every push to master — a short 5-minute smoke per target,
#   - manual dispatch with a configurable duration.
#
# They are intentionally OUT of the required-status set checked on PRs:
# fuzz time is non-deterministic and a fresh crash should not block a
# merge. New crashes become tracked issues / regression test cases.
#
# cargo-fuzz needs nightly Rust + libfuzzer-sys, so this workflow runs
# Linux-only (libfuzzer also works on macOS but Windows support is
# patchy and our target audience runs on Linux/macOS).

on:
  push:
    branches: [master]
    paths:
      - "src-tauri/src/**"
      - "src-tauri/fuzz/**"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Per-target run duration (seconds)"
        required: false
        default: "300"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [config_parser, source_read]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pick run duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=${{ github.event.inputs.duration_seconds }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          fi

      # SHA-pinned, so the toolchain can no longer be inferred from the ref
      # name (@nightly) — it must be named explicitly. cargo-fuzz needs nightly.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly

      # No need for Tauri Linux deps or the frontend build here: the
      # fuzz crate depends on nexthop_lib with `default-features =
      # false`, which drops Tauri (and `tauri::generate_context!`,
      # which would otherwise demand a built `dist/` at compile time).

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri/fuzz -> target"

      # Use the prebuilt cargo-fuzz binary. `cargo install --locked
      # cargo-fuzz` pins old `rustix 0.36.x`, which uses perma-unstable
      # rustc attributes that current nightly rejects. taiki-e's install
      # action pulls a release binary and skips the compile entirely.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-fuzz

      # `--target x86_64-unknown-linux-gnu` overrides cargo-fuzz's
      # default `*-musl` target, which uses statically linked libc and
      # rejects `-Zsanitizer=address` with "sanitizer is incompatible
      # with statically linked libc". gnu is fine and matches the host.
      - name: Run fuzz target ${{ matrix.target }} for ${{ steps.duration.outputs.seconds }}s
        working-directory: src-tauri/fuzz
        run: |
          cargo fuzz run \
            --target x86_64-unknown-linux-gnu \
            ${{ matrix.target }} -- \
            -max_total_time=${{ steps.duration.outputs.seconds }} \
            -print_final_stats=1

      # When libfuzzer finds a panic / UB it writes the crashing input
      # under `fuzz/artifacts/<target>/`. Uploading those as a workflow
      # artifact (only on failure) makes the reproducer immediately
      # downloadable for triage without re-running the fuzzer.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: src-tauri/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
