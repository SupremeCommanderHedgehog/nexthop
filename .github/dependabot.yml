# Dependabot keeps dependencies patched across every ecosystem this repo
# uses. See https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Version updates run monthly, and each ecosystem batches its minor and
# patch bumps into one grouped PR ("<ecosystem>-minor"), so routine churn
# is at most three PRs a month. Major bumps stay ungrouped so each one
# gets its own review.
#
# Security updates are not affected by this schedule: Dependabot opens
# them as soon as an advisory is published, and cargo-deny / npm audit
# in CI also catch advisories between runs.
version: 2
updates:
  # Rust: the workspace (root + src-tauri) and the standalone fuzz crate,
  # which sits outside the workspace with its own Cargo.lock. Listing
  # both directories in one entry puts them in the same grouped PR.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/src-tauri/fuzz"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Frontend (Tauri v2 + React) npm dependencies.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
